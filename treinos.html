<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFE OS — Treinos</title>
<style>
:root{--bg:#070b12;--panel:#0d1420;--panel2:#111b2a;--text:#eef5ff;--muted:#8493a7;--blue:#1687ff;--line:#1d2b3e;--green:#63e1be}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Arial}
button,input{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:24px 16px;background:#080d15;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:800}.brand span{color:var(--blue)}.sub{color:var(--muted);font-size:12px;margin:4px 0 20px}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.ghost{background:var(--panel2)}
.modules{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.modules .active{outline:1px solid var(--blue)}
main{padding:28px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.routine{cursor:pointer;transition:.15s}.routine:hover{transform:translateY(-2px);border-color:#31587e}.routine.active{outline:2px solid var(--blue)}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#10243e;color:#7abaff}.ok{background:#0e2a24;color:var(--green)}
.exercise{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}
.reps{color:#8fc6ff;font-weight:700}.section{margin-top:18px}.metric{font-size:28px;font-weight:800}.login{max-width:460px;margin:100px auto;padding:28px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="gate" class="card login"><div class="brand">LIFE <span>OS</span></div><div class="sub">TREINOS • v0.1</div><h1>Treinos</h1><p class="muted">Use o mesmo login do LIFE OS.</p><button class="btn" id="loginBtn">Entrar</button></div>
<div id="shell" class="app" style="display:none">
<aside><div class="brand">LIFE <span>OS</span></div><div class="sub">TREINOS • v0.1</div>
<div class="modules"><a class="btn ghost" href="./index.html">Instagram</a><a class="btn ghost active" href="./treinos.html">Treinos</a></div>
<div class="card"><div class="muted">Objetivo</div><b>Ganho de massa</b><div class="muted" style="margin-top:8px">71 kg → meta inicial 75 kg</div></div>
</aside>
<main>
<div class="top"><div><h1>Treinos</h1><div class="muted">Seu módulo pessoal de musculação dentro do LIFE OS.</div></div><span id="userBadge" class="badge ok">ONLINE</span></div>
<div class="grid" id="routineGrid"></div>
<div class="section card"><div class="top"><div><h2 id="routineTitle">Rotina</h2><div id="routineDay" class="muted"></div></div><button class="btn" id="startBtn">Iniciar treino</button></div><div id="exerciseList"></div></div>
<div class="section grid" style="grid-template-columns:repeat(3,1fr)">
<div class="card"><div class="muted">Peso atual</div><div class="metric">71 kg</div></div>
<div class="card"><div class="muted">Meta 1</div><div class="metric">75 kg</div></div>
<div class="card"><div class="muted">Frequência</div><div class="metric">5x/sem</div></div>
</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./treinos.js?v=0.1"></script>
</body></html>
